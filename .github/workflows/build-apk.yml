name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept preinstalled Android SDK licenses
        run: |
          SDK_MANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          echo "Android SDK ready at ${ANDROID_HOME}"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored project debug.keystore from debug.keystore.base64"
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore"
          fi

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "Using existing app/google-services.json"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            TRIMMED="$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]')"
            if printf '%s' "$TRIMMED" | grep -q '^{'; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$TRIMMED" | base64 -d > app/google-services.json
            fi
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret"
          else
            echo "::error::Missing app/google-services.json! Please add the GOOGLE_SERVICES_JSON secret in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CourseReminder-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
